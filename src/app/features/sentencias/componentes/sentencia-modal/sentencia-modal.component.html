<div class="modal-header border-0 pb-0">
  <h2 class="modal-title">{{ modalTitle }}</h2>
  <button
    type="button"
    class="btn-close-custom"
    (click)="cancelar()"
    aria-label="Close"
  >
    <i class="bi bi-x-circle"></i>
  </button>
</div>
<hr class="mx-4 mb-0" />

<div class="modal-body p-4">
  <form [formGroup]="form">
    <!-- Nombre de la Sentencia -->
    <div class="mb-3">
      <label class="form-label">
        <span class="text-danger me-1">*</span>
        Nombre del Documento :
      </label>
      <input
        type="text"
        class="form-control"
        formControlName="nombre"
        name="nombre"
        placeholder="Ingrese el nombre del documento"
      />
    </div>

    @if (tipoSentencia === "CONTABLE") {
      <div class="mb-3">
        <label class="form-label">
          <span class="text-danger me-1">*</span>
          Tipo De Documento :
        </label>
        <select class="form-select" formControlName="tipoDocumento">
          <option value="">Seleccione</option>
          <option value="Contrato de prestación de servicios">
            Contrato de prestación de servicios
          </option>
          <option value="Pago de IVA">Pago de IVA</option>
          <option value="Pago de seguridad social y complementarios">
            Pago de seguridad social y complementarios
          </option>
          <option value="Impuestos adicionales de funcionamiento comercial">
            Impuestos adicionales de funcionamiento comercial
          </option>
        </select>
      </div>
    }

    <!-- Proceso -->
    <div class="mb-3">
      <label class="form-label">
        <span class="text-danger me-1">*</span>
        Expediente :
      </label>
      <select
        class="form-select"
        formControlName="procesoId"
        (change)="onProcesoChange(formData.procesoId)"
        name="procesoId"
        [disabled]="procesos.length === 0"
      >
        <option value="" selected disabled hidden>
          Seleccionar Expediente
        </option>
        <option *ngFor="let proceso of procesos" [value]="proceso.id">
          {{ proceso.numeroProceso }}
        </option>
      </select>
      <small class="text-danger d-block mt-2" *ngIf="procesos.length === 0">
        <i class="bi bi-exclamation-circle me-1"></i>
        No Hay Expedientes Registrados
      </small>
    </div>
    <!-- Descripción -->
    <div class="mb-3">
      <label class="form-label">Descripción : </label>
      <textarea
        class="form-control"
        formControlName="description"
        name="description"
        rows="3"
        placeholder="Ej: Descripción o notas adicionales sobre la sentencia"
      ></textarea>
    </div>

    <!-- Seleccionar archivo -->
     <label class="form-label">
      <span class="text-danger me-1">*</span>
      Archivo : 
    </label>
    <div class="file-upload-area">
      <input
        type="file"
        id="fileInputSentencia"
        class="d-none"
        (change)="onFileSelected($event)"
        accept=".pdf,.doc,.docx,.jpg,.png"
      />
      <label for="fileInputSentencia" class="file-upload-label" *ngIf="!selectedFile">
        <i class="bi bi-upload fs-3 mb-2"></i>
        <p class="mb-0">Seleccionar archivo de sentencia</p>
        <small class="text-muted">PDF, DOC, DOCX, JPG o PNG</small>
      </label>
      <p class="file-name mt-2" *ngIf="selectedFile">
        <i class="bi bi-file-earmark me-1"></i>
        {{ selectedFile.name }}
      </p>
    </div>
  </form>
</div>

<div class="modal-footer border-0 pt-0 px-4 pb-4">
  <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">
    Cancelar
  </button>
  <button type="button" class="btn btn-primary" (click)="saveEvent()">
    Guardar Sentencia
  </button>
</div>
